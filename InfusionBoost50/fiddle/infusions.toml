# Strongest tier of the Infusion Boost rebalance: Hasty's new value is 50%
# (rather than the base 4%), with every other infusion scaled by the same
# 12.5x factor (50 / 4). This is a standalone alternative to ../InfusionBoost
# and ../InfusionBoost20 -- install only ONE of these three, since they all
# override the same fiddle/infusions.toml tables.
#
# Each table below is a FULL reproduction of its vanilla entry (verified
# against the game's own assets.zip), with only the numeric field(s) and
# description changed. Only the tables actually being changed are included;
# every other infusion (Restorative, Magical, Likeable, Loveable, Fairy, and
# the four unique craftable=false sword infusions) is left untouched.
#
# Two adjustments from a strict 12.5x multiply:
#   - Sharp/Leeching's flat amount (1 * 12.5 = 12.5) is rounded up to 13,
#     since these are whole per-hit numbers.
#   - Lightweight is a drop-CHANCE (0-100 scale). 10 * 12.5 = 125 would be a
#     bigger-than-100% chance, which is meaningless, so it's capped at 100.

[fortified]
	color = [239, 81, 62, 255]
	name = "Fortified"
	description = "Base HP is increased by +50."
	amount = 50
	required_perk = "fortified_blacksmithing"
	sub_icon = "spr_ui_item_sub_infusion_blacksmith_fortified"
	tooltip_icon = "spr_ui_tooltip_infusion_icon_blacksmith_fortified"
	supported_tags = ["armor"]

[hasty]
	color = [240, 141, 46, 255]
	name = "Hasty"
	description = "Increases movement speed by 50%."
	percentage = 0.50
	required_perk = "hasty_blacksmithing"
	sub_icon = "spr_ui_item_sub_infusion_blacksmith_hasty"
	tooltip_icon = "spr_ui_tooltip_infusion_icon_blacksmith_hasty"
	supported_tags = ["armor"]


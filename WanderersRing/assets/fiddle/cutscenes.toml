# Delivers the Wanderer's Ring recipe scroll once the player has reached
# floor 80 of the mines. Modeled directly on vanilla's own milestone-delivery
# pattern (see e.g. [shooting_star_morning] in the base game's cutscenes.toml):
# no dialogue is required, it just fires the next time the player is on the
# farm map with the requirement satisfied, and `can_repeat = false` (the
# default) means it only grants the item once.
[wanderers_ring_milestone]
	test_target = "none"
	trigger = { location = "farm" }
	given_items = [{ item_id = "wanderers_ring_recipe_scroll" }]
	requirements.reached_mines_level = 80

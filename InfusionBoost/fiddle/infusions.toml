# Bumps every general-purpose, player-craftable infusion to a stronger value
# (roughly 2.5x its vanilla number, matching Hasty going from 4% to 10%).
#
# Each table below is a FULL reproduction of its vanilla entry in
# fiddle/infusions.toml (verified against the game's own assets.zip), with
# only the numeric field(s) and description changed — infusion tables merge
# by key, so as long as we restate every field, the merge is safe regardless
# of whether it's a shallow or deep merge. Only the tables actually being
# changed are included here; every other infusion (Restorative, Magical,
# Likeable, Loveable, Fairy, and the four unique craftable=false sword
# infusions) is left completely untouched.
#
# This is a standalone, static rebalance — there is no in-game menu for
# adjusting these values (the modding format here is data-only; there's no
# scripting/hook system to build custom UI with). If you want a different
# strength, this mod is meant to be the "pick one variant" — duplicate this
# file with different numbers as its own mod if you want another tier.

[fortified]
	color = [239, 81, 62, 255]
	name = "Fortified"
	description = "Base HP is increased by +10."
	amount = 10
	required_perk = "fortified_blacksmithing"
	sub_icon = "spr_ui_item_sub_infusion_blacksmith_fortified"
	tooltip_icon = "spr_ui_tooltip_infusion_icon_blacksmith_fortified"
	supported_tags = ["armor"]

